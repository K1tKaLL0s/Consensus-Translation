<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cn-Jp Translate MVP</title>
  <style>
    body {
      margin: 0;
      font-family: "Microsoft YaHei", sans-serif;
      width: 320px;
      padding: 12px;
      box-sizing: border-box;
      background: #f6f8fb;
      color: #1f2937;
    }

    h1 {
      font-size: 14px;
      margin: 0 0 10px;
    }

    label {
      display: block;
      font-size: 12px;
      margin: 8px 0 4px;
    }

    input,
    textarea,
    button {
      width: 100%;
      box-sizing: border-box;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 12px;
      padding: 8px;
    }

    textarea {
      min-height: 96px;
      resize: vertical;
    }

    button {
      margin-top: 10px;
      border: none;
      background: #0f766e;
      color: #ffffff;
      cursor: pointer;
      font-weight: 600;
    }

    #result {
      margin-top: 10px;
      font-size: 12px;
      white-space: pre-wrap;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 8px;
      min-height: 48px;
    }
  </style>
</head>
<body>
  <h1>翻译任务提交（MVP）</h1>

  <label for="text">文本</label>
  <textarea id="text" placeholder="请输入待翻译文本"></textarea>

  <label for="source">来源声明</label>
  <input id="source" type="text" placeholder="例如：教材A-第三章" />

  <button id="submit" type="button">提交到 /tasks/translate</button>

  <div id="result">等待提交</div>

  <script src="popup.js"></script>
</body>
</html>
