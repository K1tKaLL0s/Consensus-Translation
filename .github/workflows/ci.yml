name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  python-safe-tests:
    name: Python safe tests
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install safe test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==8.3.5 pydantic==2.11.4 rapidfuzz==3.9.4 python-docx==1.1.2 pyyaml==6.0.2 requests==2.32.3 "PySide6>=6.8,<6.10" "pytest-qt>=4.4,<5"

      - name: Run safe Python subset
        run: |
          $base = Join-Path $env:RUNNER_TEMP "pytest-safe"
          python -m pytest -p no:cacheprovider --basetemp "$base-capability" tests/capability
          python -m pytest -p no:cacheprovider --basetemp "$base-workflows" tests/test_agent_workflows.py
          python -m pytest -p no:cacheprovider --basetemp "$base-preflight" tests/test_agent_preflight.py
          python -m pytest -p no:cacheprovider --basetemp "$base-provider-config" tests/test_agent_provider_config.py
          python -m pytest -p no:cacheprovider --basetemp "$base-qt" tests/test_desktop_qt_workflows.py
          python -m pytest -p no:cacheprovider --basetemp "$base-react" tests/test_react_desktop_integration.py

  react-build:
    name: React build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: "UI design/High-Fidelity Translation Software UI/package-lock.json"

      - name: Install React dependencies
        working-directory: "UI design/High-Fidelity Translation Software UI"
        run: npm ci

      - name: Build React UI to temp output
        working-directory: "UI design/High-Fidelity Translation Software UI"
        run: |
          $out = Join-Path $env:RUNNER_TEMP "react-build"
          npm run build -- --outDir "$out" --emptyOutDir
